<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Modelo de painel financeiro para pequenas empresas: vendas, contas a receber e a pagar, gastos, estoque e clientes." />
    <title>Gestão financeira</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Aplica o tema antes da primeira pintura (sem "piscar" o tema errado). Mesma chave de src/tema.ts.
      (function () {
        var t = "sistema";
        try { t = localStorage.getItem("mf-tema") || "sistema"; } catch (e) {}
        var escuro = t === "escuro" || (t !== "claro" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.tema = escuro ? "escuro" : "claro";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
